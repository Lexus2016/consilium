name: Bug report
description: Report a reproducible problem with this project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Use public or synthetic examples.
        Do not include credentials, private source, personal data, session logs,
        dashboard sign-in tokens, or exploitable security details.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the exact commit when using a source checkout.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, installation method and relevant agent CLI versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include a short redacted error excerpt if useful.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already tried
      description: List relevant tests and their results, including skips.
