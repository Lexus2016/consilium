name: Feature request
description: Describe a concrete use case and a focused improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what is difficult today? Avoid private data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome and how it could be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include compatibility, privacy or cost considerations when relevant.
